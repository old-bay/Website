<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC HvZ - Admin Panel</title>
  <link rel="icon" type="image/png" href="/images/hvzLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>

<section class="page-header"><div class="container"><h1>Admin Panel</h1></div></section>

<main id="main-content">
  <div class="container">
    <div id="admin-content"><div class="card"><p class="text-muted">Loading...</p></div></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const area = document.getElementById('admin-content');
  try {
    const me = await HvZ.getMe();
    if (!me.loggedIn || me.isAdmin < 1) { area.innerHTML = '<div class="card"><p>Access denied. <a href="/">Return home</a>.</p></div>'; return; }

    let html = `<div class="card"><h2>Welcome, Admin</h2><p>Admin level: ${me.isAdmin}</p></div>`;

    // Subofficer+ tools
    html += '<div class="card"><h2>Officer Tools</h2><ul>';
    html += '<li><a href="/admin/meetings">Meeting Management</a></li>';
    html += '<li><a href="/admin/achievements">Award Achievements</a></li>';
    if (me.isAdmin >= 2) {
      html += '<li><a href="/admin/blog-post">Create Blog Post</a></li>';
      html += '<li><a href="/admin/voting">Election Management</a></li>';
      html += '<li><a href="/admin/player-record">Player Records</a></li>';
      html += '<li><a href="/admin/sidebar">Edit Sidebar / Slides</a></li>';
      html += '<li><a href="/admin/equipment">Equipment Management</a></li>';
      html += '<li><a href="/admin/polls">Poll Management</a></li>';
      html += '<li><a href="/admin/faq">FAQ Editor</a></li>';
      html += '<li><a href="/admin/training">Training Resources</a></li>';
      html += '<li><a href="/admin/voting-members">Voting Members / Semester Reset</a></li>';
    }
    html += '</ul></div>';

    // Long game tools
    if (me.isLongGameAuthed >= 1) {
      html += '<div class="card"><h2>Long Game Tools</h2><ul>';
      html += '<li><a href="/admin/long-game">Long Game Registration</a></li>';
      html += '<li><a href="/admin/oz">OZ Selection</a></li>';
      html += '<li><a href="/admin/points">Points Management</a></li>';
      html += '</ul></div>';
    }

    area.innerHTML = html;
  } catch (e) { area.innerHTML = '<div class="card"><p>Please <a href="/">sign in</a> first.</p></div>'; }
});
</script>
</body>
</html>
