<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC HvZ - Player Records</title>
  <link rel="icon" type="image/png" href="/images/hvzLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>
<section class="page-header"><div class="container"><h1>Player Records</h1></div></section>
<main id="main-content">
  <div class="container">
    <div class="card"><h2>Update Vaccination Status</h2>
      <form onsubmit="return sub(event,'/api/admin/player-record/vaccine',['username','status'])">
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
        <div class="form-group"><label>Status</label>
          <select class="form-control" name="status"><option value="0">Not vaccinated</option><option value="1">Single dose</option><option value="2">Double-vaccinated</option><option value="3">Fully-vaccinated with booster</option></select></div>
        <button type="submit" class="btn btn-primary">Update</button>
      </form></div>
    <div class="card"><h2>Update Waiver Record</h2>
      <form onsubmit="return sub(event,'/api/admin/player-record/waiver',['username','status'])">
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
        <div class="form-group"><label>Status</label>
          <select class="form-control" name="status"><option value="0">Not signed</option><option value="1">Signed</option></select></div>
        <button type="submit" class="btn btn-primary">Update</button>
      </form></div>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>async function sub(e,url,f){e.preventDefault();const fd=new FormData(e.target);const b={};f.forEach(k=>b[k]=fd.get(k));await HvZ.post(url,b);alert('Updated!');return false;}</script>
</body>
</html>
