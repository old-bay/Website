<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const me = await HvZ.getMe();
    if (me.isAdmin >= 3) {
      document.getElementById('webcom-section').innerHTML = `
        <h3 style="margin-top:1.5rem;">Web Committee Only</h3>
        <ol start="5"><li><a href="https://www.youtube.com/watch?v=Qskm9MTz2V4" target="_blank" rel="noopener noreferrer">GitHub and Database Access</a></li></ol>`;
    }
  } catch (e) {}
});
</script>
