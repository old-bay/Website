<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC HvZ - News</title>
  <meta name="description" content="Latest news and announcements from UMBC HvZ.">
  <link rel="icon" type="image/png" href="/images/hvzLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>

<section class="page-header"><div class="container"><h1>News</h1></div></section>

<main id="main-content">
  <div class="container content-grid">
    <div class="content-area" id="news-area">
      <div class="card"><p class="text-muted">Loading news...</p></div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>
let currentPage = 0;
const perPage = 5;
let isAdmin = false;

document.addEventListener('DOMContentLoaded', async () => {
  try { const me = await HvZ.getMe(); isAdmin = me.isAdmin >= 2; } catch (e) {}
  loadNews();
});

async function loadNews() {
  const area = document.getElementById('news-area');
  try {
    const data = await HvZ.get(`/api/news?start=${currentPage * perPage}&limit=${perPage}`);
    if (data.posts.length === 0) { area.innerHTML = '<div class="card"><p>No news posts yet.</p></div>'; return; }
    let html = data.posts.map(p => `
      <div class="card news-post">
        <h2>${HvZ.escapeHtml(p.title)}</h2>
        <p class="text-muted">By ${HvZ.escapeHtml(p.author)} &mdash; ${p.postedAgo}</p>
        <div>${p.content}</div>
        ${isAdmin ? `<button class="btn btn-outline" style="margin-top:0.5rem;" onclick="deletePost(${p.id})">Delete Post</button>` : ''}
      </div>`).join('');
    // Pagination
    const totalPages = Math.ceil(data.total / perPage);
    if (totalPages > 1) {
      html += '<div style="display:flex;gap:0.5rem;margin-top:1rem;">';
      if (currentPage > 0) html += `<button class="btn btn-outline" onclick="changePage(${currentPage - 1})">&laquo; Previous</button>`;
      html += `<span style="padding:0.5rem;">Page ${currentPage + 1} of ${totalPages}</span>`;
      if (currentPage < totalPages - 1) html += `<button class="btn btn-outline" onclick="changePage(${currentPage + 1})">Next &raquo;</button>`;
      html += '</div>';
    }
    area.innerHTML = html;
  } catch (e) { area.innerHTML = '<div class="card"><p>Error loading news.</p></div>'; }
}

function changePage(page) { currentPage = page; loadNews(); }

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await HvZ.del('/api/news/' + id);
  loadNews();
}
</script>
</body>
</html>
