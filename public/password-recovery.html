<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC HvZ - Password Recovery</title>
  <meta name="description" content="Recover your UMBC HvZ account password.">
  <link rel="icon" type="image/png" href="/images/hvzLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>

<section class="page-header"><div class="container"><h1>Password Recovery</h1></div></section>

<main id="main-content">
  <div class="container content-grid">
    <div class="content-area">
      <div id="status-msg" style="display:none;padding:0.75rem;border-radius:var(--radius);margin-bottom:1rem;"></div>
      <div class="info-grid">
        <div class="card">
          <h2>Reset by Username</h2>
          <form id="form-username">
            <div class="form-group">
              <label for="reset-uname">Username</label>
              <input class="form-control" type="text" id="reset-uname" required>
            </div>
            <button type="submit" class="btn btn-primary">Reset password</button>
          </form>
        </div>
        <div class="card">
          <h2>Recover by Email</h2>
          <form id="form-email">
            <div class="form-group">
              <label for="reset-email">Email</label>
              <input class="form-control" type="email" id="reset-email" required>
            </div>
            <button type="submit" class="btn btn-primary">Recover account</button>
          </form>
        </div>
      </div>

      <div class="card" id="reset-card" style="display:none;">
        <h2>Enter Reset Code</h2>
        <form id="form-reset">
          <div class="form-group">
            <label for="reset-code">Reset Code</label>
            <input class="form-control" type="text" id="reset-code" required>
          </div>
          <div class="form-group">
            <label for="new-pass">New Password</label>
            <input class="form-control" type="password" id="new-pass" required>
          </div>
          <button type="submit" class="btn btn-primary">Set New Password</button>
        </form>
      </div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>
const statusMsg = document.getElementById('status-msg');
function showMsg(text, isError) {
  statusMsg.textContent = text;
  statusMsg.style.display = 'block';
  statusMsg.style.background = isError ? 'var(--color-accent)' : 'var(--color-success)';
  statusMsg.style.color = '#fff';
}

// Check for code in URL
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) { document.getElementById('reset-code').value = urlCode; document.getElementById('reset-card').style.display = 'block'; }

document.getElementById('form-username').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await HvZ.recover({ username: document.getElementById('reset-uname').value }); showMsg('Recovery email sent! Check your inbox.', false); document.getElementById('reset-card').style.display = 'block'; }
  catch (err) { showMsg(err.error || 'Error', true); }
});
document.getElementById('form-email').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await HvZ.recover({ email: document.getElementById('reset-email').value }); showMsg('Recovery email sent! Check your inbox.', false); document.getElementById('reset-card').style.display = 'block'; }
  catch (err) { showMsg(err.error || 'Error', true); }
});
document.getElementById('form-reset').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass = document.getElementById('new-pass').value;
  const msgBuf = new TextEncoder().encode(pass);
  const hashBuf = await crypto.subtle.digest('SHA-256', msgBuf);
  const hashed = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  try { await HvZ.resetPassword({ code: document.getElementById('reset-code').value, password: hashed }); showMsg('Password reset! You can now log in.', false); }
  catch (err) { showMsg(err.error || 'Error', true); }
});
</script>
</body>
</html>
