<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC HvZ - Register</title>
  <meta name="description" content="Create your UMBC HvZ account.">
  <link rel="icon" type="image/png" href="/images/hvzLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>

<section class="page-header"><div class="container"><h1>Register</h1></div></section>

<main id="main-content">
  <div class="container content-grid">
    <div class="content-area">
      <div class="card">
        <p>Create an account to play UMBC HvZ. Your account is used for game registration, kill logging, and achievement tracking.</p>
        <div id="reg-error" style="color:var(--color-accent);display:none;margin-bottom:1rem;"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="fname">First Name</label>
            <input class="form-control" type="text" id="fname" name="fname" required>
          </div>
          <div class="form-group">
            <label for="lname">Last Name</label>
            <input class="form-control" type="text" id="lname" name="lname" required>
          </div>
          <div class="form-group">
            <label for="email">UMBC Email</label>
            <input class="form-control" type="email" id="email" name="email" required placeholder="yourname@umbc.edu">
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="password2">Confirm Password</label>
            <input class="form-control" type="password" id="password2" name="password2" required>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="tos" name="tos" required> I agree to the <a href="/rules" target="_blank">rules and terms of participation</a></label>
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('reg-error');
  errEl.style.display = 'none';
  const fd = new FormData(e.target);
  const pass = fd.get('password');
  if (pass !== fd.get('password2')) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
  // Hash password client-side (SHA256) before sending
  const msgBuf = new TextEncoder().encode(pass);
  const hashBuf = await crypto.subtle.digest('SHA-256', msgBuf);
  const hashed = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  try {
    await HvZ.register({ fname: fd.get('fname'), lname: fd.get('lname'), email: fd.get('email'), username: fd.get('username'), password: hashed, tos: fd.get('tos') === 'on' });
    window.location.href = '/profile';
  } catch (err) { errEl.textContent = err.error || 'Registration failed.'; errEl.style.display = 'block'; }
});
</script>
</body>
</html>
